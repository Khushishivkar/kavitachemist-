{% extends 'base.html' %}
{% block title %}Delete Supplier{% endblock %}
{% block extra_css %}<style>body{background:#f4f6fa;}</style>{% endblock %}
{% block content %}
<div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><div class="sidebar-logo">⚕</div><div><div class="sidebar-brand">Kavita Chemist</div></div></div>
        <nav class="sidebar-nav"><a href="{% url 'supplier_list' %}" class="sidebar-link active"><i class="fas fa-truck"></i> Suppliers</a></nav>
    </aside>
    <main class="dashboard-main">
        <div class="confirm-delete-page">
            <div class="confirm-card">
                <div class="confirm-icon"><i class="fas fa-exclamation-triangle"></i></div>
                <h2>Delete Supplier?</h2>
                <p>Delete <strong>{{ supplier.name }}</strong>? Products linked to this supplier will not be deleted.</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="confirm-actions">
                        <a href="{% url 'supplier_list' %}" class="btn btn-ghost">Cancel</a>
                        <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Yes, Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
{% endblock %}
